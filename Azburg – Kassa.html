<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azburg – Kassa</title>
<style>
:root{--bg:#f6f1e7;--card:#fff;--tx:#1c1712;--mu:#7a6f60;--ac:#b8892b;--acx:#fff;--bd:#e3d9c6;--ok:#2e7d32;--rd:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d0b;--card:#211914;--tx:#f4ead8;--mu:#a69a86;--ac:#d4a63c;--acx:#1a1208;--bd:#3a2d22;--ok:#66bb6a;--rd:#ef5350}}
:root[data-theme="dark"]{--bg:#120d0b;--card:#211914;--tx:#f4ead8;--mu:#a69a86;--ac:#d4a63c;--acx:#1a1208;--bd:#3a2d22;--ok:#66bb6a;--rd:#ef5350}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd)}
h1{margin:0;font-size:22px;letter-spacing:3px;color:var(--ac)}
header small{color:var(--mu);display:block;letter-spacing:0;font-size:12px}
.tools{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px;max-width:1100px;margin:auto}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
h2{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin:16px 0 8px}
h2:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:left;min-height:84px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.it:active{transform:scale(.97)}
.it img{width:100%;height:84px;object-fit:cover;border-radius:8px;margin-bottom:8px;background:#1a120e}.it b{font-size:15px}.it span{color:var(--mu);font-size:12px}
.it .pr{color:var(--ac);font-weight:700;font-size:15px}
.it input{width:100%;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.cart{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;align-self:start;position:sticky;top:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.row .n{flex:1;font-size:14px}.row .n small{display:block;color:var(--mu)}
.q{display:flex;align-items:center;gap:6px}.q button{padding:2px 10px;font-size:18px}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:12px 0}
.tot span:last-child{color:var(--ac)}
label{font-size:13px;color:var(--mu)}
.cash{width:100%;font-size:20px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 8px}
.chg{font-size:16px;margin-bottom:10px}.chg b{color:var(--ok)}.chg b.neg{color:var(--rd)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.quick button{padding:6px 10px;font-size:13px}
.acts{display:flex;gap:8px}.acts button{flex:1;padding:12px}
.empty{color:var(--mu);text-align:center;padding:20px 0}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);max-width:420px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.5)}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre-wrap}
.sales{font-size:14px;color:var(--mu);margin-top:12px;text-align:center}
#rdlg{max-width:900px;width:96%;max-height:94vh;overflow:auto}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px}.rh h3{margin:0;font-size:26px;letter-spacing:2px;color:var(--ac)}.rh small{color:var(--mu);font-size:15px}
.rbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.rbig div{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:center}
.rbig b{display:block;font-size:clamp(28px,6vw,48px);color:var(--ac)}.rbig span{color:var(--mu);font-size:15px}
.rt{width:100%;border-collapse:collapse;font-size:20px}.rt th{font-size:13px;color:var(--mu);text-align:left;padding:8px;text-transform:uppercase;letter-spacing:1px}
.rt td{padding:12px 8px;border-bottom:1px solid var(--bd)}.rt td:nth-child(2),.rt th:nth-child(2){text-align:center}.rt td:nth-child(2){font-weight:800;font-size:26px}
.rt td:last-child,.rt th:last-child{text-align:right;font-weight:700}.rt tfoot td{font-weight:800;color:var(--ac);font-size:24px;border:0}
.ol{font-size:18px;margin-top:8px}.ol div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd)}
@media print{body *{visibility:hidden}dialog,dialog *{visibility:visible}dialog{position:absolute;left:0;top:0;border:0}dialog button{display:none}}
</style></head><body>
<header>
 <div><h1>AZBURG</h1><small>Kassa · Burger · Hot dog · Tost · Choy</small></div>
 <div class="tools"><button id="tgBtn">Telegram</button><button id="edBtn">Narxlarni tahrirlash</button><button id="rep">Kunlik hisobot</button></div>
</header>
<div class="wrap">
 <main id="menu"></main>
 <aside class="cart">
  <div id="lines"></div>
  <div class="tot"><span>Jami</span><span id="total">0 soʻm</span></div>
  <label for="cash">Mijoz bergan pul</label>
  <input id="cash" class="cash" type="number" inputmode="numeric" placeholder="0">
  <div class="quick" id="quick"></div>
  <div class="chg">Qaytim: <b id="chg">0 soʻm</b></div>
  <div class="acts"><button id="clr">Tozalash</button><button id="pay" class="p">Toʻlov qabul qilindi</button></div>
  <div class="sales" id="today"></div>
 </aside>
</div>
<dialog id="rdlg"><div id="rbody"></div><div class="acts" style="margin-top:14px"><button id="rtg">Telegramga yuborish</button><button id="rprt">Chop etish</button><button id="rcl" class="p">Yopish</button></div></dialog>
<dialog id="dlg"><div class="rc" id="rcp"></div><div class="acts" style="margin-top:12px"><button id="tgs">Telegramga yuborish</button><button id="undo" style="display:none">Bekor qilish (otkaz)</button><button id="prt">Chop etish</button><button id="cl" class="p">Yopish</button></div></dialog>
